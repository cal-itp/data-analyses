[project]
name = "gtfs-rt-search"
version = "0.1.0"
requires-python = ">=3.11.0, <3.12.0"
dependencies = [
    "calitp-data-analysis",             # BigQuery engine; brings pandas + requests
    "gtfs-realtime-bindings>=2.2.0,<3", # <3 keeps protobuf<7, which the google-* stack requires
    "google-cloud-secret-manager",      # resolves {{ SECRET_NAME }} placeholders in feed URLs
    "pyyaml",
    "pyarrow",
    "folium>=0.20.0,<0.21.0",           # plot_trip_positions.ipynb; matches shared-utils
    "geopandas",
]

[tool.uv]
package = false

[tool.uv.sources]
calitp-data-analysis = { workspace = true }
